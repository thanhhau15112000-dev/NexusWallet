[package]
name = "nexus-task-vault"
version = "0.1.0"
description = "Task Capability Vault for Autonomous AI Agents on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nexus_task_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(solana)', 'cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug"))'] }
