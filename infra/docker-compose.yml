services:
  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    environment:
      DEPLOYMENT_MODE: hosted
      HOST: 0.0.0.0
      PORT: "8787"
      AGENT_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - agent-data:/data
    restart: unless-stopped

volumes:
  agent-data:
